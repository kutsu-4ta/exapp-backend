services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: exapp-backend
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - exapp-network
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    container_name: exapp-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:-exapp}
      POSTGRES_USER: ${DB_USERNAME:-exapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-exapp} -d ${DB_DATABASE:-exapp}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - exapp-network
    restart: unless-stopped
#    restart: on-failure:5

volumes:
  db-data:

networks:
  exapp-network:
    driver: bridge
