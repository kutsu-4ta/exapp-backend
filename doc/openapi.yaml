openapi: 3.0.3
info:
  title: Exapp API
  description: 中小企業診断士 学習管理アプリ API仕様書
  version: 0.1.0

servers:
  - url: /api
    description: Next.js proxy (→ backend)

# ルートレベルで認証を有効化（全体適用）
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TimeSlot:
      type: string
      enum: [morning, lunch, commute, night]
    Subject:
      type: string
      enum:
        - 経済学・経済政策
        - 財務・会計
        - 企業経営理論
        - 運営管理
        - 経営法務
        - 経営情報システム
        - 中小企業経営・政策
    Material:
      type: string
      enum: [テキスト, 問題集, スピード問題集, 過去問, その他]

    StudySession:
      type: object
      required: [id, dailyLogDate, timeSlot, minutes, subject, material]
      properties:
        id: { type: integer }
        dailyLogDate: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudySessionInput:
      type: object
      required: [timeSlot, minutes, subject, material]
      properties:
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        memo: { type: string, nullable: true }

    DailyLog:
      type: object
      required: [date, isCompleted, studySessions]
      properties:
        date: { type: string, format: date }
        reflection: { type: string, nullable: true }
        isCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        studySessions:
          type: array
          items: { $ref: '#/components/schemas/StudySession' }
        totalMinutes: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DailyLogSummary:
      type: object
      required: [date, isCompleted, totalMinutes]
      properties:
        date: { type: string, format: date }
        isCompleted: { type: boolean }
        totalMinutes: { type: integer }
        sessionCount: { type: integer }

    Proficiency:
      type: string
      enum: ['○', '△', '×']

    FailureType:
      type: string
      enum: ['定義漏れ', '解法ミス', '計算ミス']

    Problem:
      type: object
      required: [id, subject, material, questionRef, proficiency, failureTypes, isGoodQuestion, solvedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        solvedAt: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProblemInput:
      type: object
      required: [subject, material, questionRef, proficiency, failureTypes, isGoodQuestion, solvedAt]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        solvedAt: { type: string, format: date }

    DashboardStats:
      type: object
      required: [thisMonthMinutes, thisMonthDays, last7DaysMinutes, weeklyAvgMinutes, subjectMinutes, lastTouchedBySubject, dailyMinutes]
      properties:
        thisMonthMinutes: { type: integer }
        thisMonthDays: { type: integer }
        last7DaysMinutes: { type: integer }
        weeklyAvgMinutes: { type: number, format: float }
        subjectMinutes:
          type: array
          items:
            type: object
            required: [subject, minutes]
            properties:
              subject: { type: string }
              minutes: { type: integer }
        lastTouchedBySubject:
          type: array
          items:
            type: object
            required: [subject, lastDate]
            properties:
              subject: { type: string }
              lastDate: { type: string, format: date, nullable: true }
        dailyMinutes:
          type: array
          items:
            type: object
            required: [date, minutes]
            properties:
              date: { type: string, format: date }
              minutes: { type: integer }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

paths:
  /daily-logs:
    get:
      summary: 月間ログ一覧を取得
      tags: [Daily Logs]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyLogSummary' }
        '401':
          description: 未認証
    post:
      summary: デイリーログを作成
      tags: [Daily Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401':
          description: 未認証

  /daily-logs/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    get:
      summary: 特定日のログを取得
      tags: [Daily Logs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401':
          description: 未認証
        '404':
          description: 未作成
    put:
      summary: 振り返りテキストを更新
      tags: [Daily Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reflection: { type: string, nullable: true }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401':
          description: 未認証

  /study-sessions:
    post:
      summary: 学習ブロックを追加
      tags: [Study Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/StudySessionInput'
                - type: object
                  required: [dailyLogDate]
                  properties:
                    dailyLogDate: { type: string, format: date }
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySession' }
        '401':
          description: 未認証

  /study-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: 学習ブロックを更新
      tags: [Study Sessions]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudySessionInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudySession' }
        '401':
          description: 未認証
    delete:
      summary: 学習ブロックを削除
      tags: [Study Sessions]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証

  /problems:
    get:
      summary: 苦手問題一覧を取得
      tags: [Problems]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 未認証
    post:
      summary: 苦手問題を追加
      tags: [Problems]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 未認証

  /dashboard/stats:
    get:
      summary: ダッシュボード集計データを取得
      tags: [Dashboard]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '401':
          description: 未認証

  /auth/logout:
    post:
      summary: ログアウト
      tags: [Auth]
      description: |
        現在使用中のアクセストークンを削除し、セッションを終了します。
        内部的には Laravel Sanctum の `currentAccessToken()->delete()` を実行します。
      security:
        - bearerAuth: [] # この操作には有効なトークンが必須
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログアウトしました。
        '401':
          description: 未認証、またはトークンが無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ── Auth (No Security) ──────────────────────────────────────────────────────

  /auth/login:
    post:
      summary: ログイン
      tags: [Auth]
      security: [] # 認証除外
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string }

  /auth/register:
    post:
      summary: 新規登録
      tags: [Auth]
      security: [] # 認証除外
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string }
                password_confirmation: { type: string }
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  user:
                    type: object
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string }
