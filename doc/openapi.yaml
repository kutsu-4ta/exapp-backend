      summary: Googleログイン（Firebase ID Token検証）
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string, description: 'Firebase ID Token' }
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string, description: 'アクセストークン（Bearer）' }
                  user:
                    type: object
                    required: [id, name, email]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string, format: email }
        '401':
          description: IDトークンが無効
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      summary: トークンリフレッシュ
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: 'Firebase リフレッシュトークン' }
      responses:
        '200':
          description: リフレッシュ成功
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: '新しいアクセストークン（Bearer）' }
        '401':
          description: リフレッシュトークンが無効
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      summary: 認証済みユーザー情報取得
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  email: { type: string, format: email }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Profile ──────────────────────────────────────────────────────────────────

  /profile:
    get:
      summary: プロフィール取得
      tags: [Profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: 未認証
    put:
      summary: プロフィール更新（upsert）
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileInput' }
            example:
              nickname: やっぴー
              occupation: ITエンジニア（SE）
              goal: 中小企業診断士試験に一発合格（週45時間学習）
              weakAreas: 経営法務、中小企業経営・政策
              strongAreas: 財務・会計、経営情報システム
              interests: 物理学、歴史、哲学、言語学
              geminiToken: AIzaSy...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: 未認証
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── AI Advice ────────────────────────────────────────────────────────────────

  /ai/advice:
    post:
      summary: AIアドバイスを生成
      tags: [AI]
      description: |
        ユーザーの学習ログ・苦手問題・目標データをもとに Gemini API を呼び出し、
        モード別のアドバイスを生成して返す。

        | モード | 内容 |
        |---|---|
        | `ANALYSIS` | 今週の達成率・残り時間を算出し、時間ブロック配置案を提案 |
        | `INSPIRATION` | 客観的な事実で学習努力を称える |
        | `ANALOGY` | 試験概念を趣味に例えて解説 |
        | `WARNING` | 危機感を煽る冷徹な鬼コーチ |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/AiAdviceMode'
            examples:
              analysis:
                summary: ANALYSISモード
                value: { mode: ANALYSIS }
              inspiration:
                summary: INSPIRATIONモード
                value: { mode: INSPIRATION }
      responses:
        '200':
          description: アドバイス生成成功
          content:
            application/json:
              schema:
                type: object
                required: [advice]
                properties:
                  advice:
                    type: string
                    description: 生成されたアドバイス（100〜250文字程度）
                    example: '今週は財務・会計に集中しているが、法務が0分。残り12時間のうち3時間を法務に充て、過去問2年分を解くことで弱点を一気に潰せる。'
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: modeが不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Gemini API 呼び出し失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /ai/analysis:
    post:
      summary: 問題画像を解析して苦手問題に登録
      tags: [AI]
      description: |
        アップロードされた試験問題の画像を Gemini 1.5 Flash でマルチモーダル解析し、
        科目・問題番号・要点・失敗タイプを自動抽出して苦手問題 (Problem) として保存する。

        - 習熟度は `×`（未習得）で固定
        - `solved_at` は本日の日付
        - 科目が未登録の場合は自動作成
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 問題画像（JPEG / PNG / WebP / HEIC、最大 10MB）
                memo:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: 解答時のユーザーメモ。指定するとGeminiのノート生成に間違えた原因・改善ポイントが追加される。
      responses:
        '201':
          description: 解析成功・苦手問題として保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: バリデーションエラー（ファイル形式不正など）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '500':
          description: Gemini が JSON を返さなかった場合など
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Gemini API 呼び出し失敗（クォータ超過など）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Practice sessions ────────────────────────────────────────────────────────

  /practice/sessions/draft:
    put:
      summary: 演習ドラフトを保存（途中再開用）
      tags: [Practice]
      description: |
        演習途中の状態を保存する。同一科目のドラフトが存在する場合は上書きする。
        フロントエンドは回答のたびに呼び出すことで、アプリ終了後の再開を可能にする。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
      responses:
        '204':
          description: 保存成功
        '401':
          description: 未認証
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /practice/sessions/draft/{subject}:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 演習ドラフトを取得
      tags: [Practice]
      responses:
        '200':
          description: ドラフトが存在する
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
        '404':
          description: ドラフトなし
        '401':
          description: 未認証
    delete:
      summary: 演習ドラフトを削除（完了・破棄時）
      tags: [Practice]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証

  /practice/sessions:
    post:
      summary: 演習セッションを保存する
      tags: [Practice]
      description: |
        一問一答演習の結果を保存する。
        バックエンドは受け取った totalElapsedMs を分単位（切り上げ）に変換し、
        該当日の DailyLog に StudySession を自動生成することを推奨する。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionInput' }
      responses:
        '201':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionResult' }
        '401':
          description: 未認証
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: ログアウト
      tags: [Auth]
      description: |
        現在使用中のアクセストークンを削除し、セッションを終了します。
        内部的には Laravel Sanctum の `currentAccessToken()->delete()` を実行します。
      security:
        - bearerAuth: [] # この操作には有効なトークンが必須
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログアウトしました。
        '401':
          description: 未認証、またはトークンが無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
