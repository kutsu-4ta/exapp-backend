  # ── Gemini Context ───────────────────────────────────────────────────────────

  /gemini/context:
    get:
      summary: Geminiコピー用コンテキストデータを取得
      tags: [AI]
      description: |
        ダッシュボード統計と全科目の詳細情報をまとめて返す。
        フロントエンドがGemini向けプロンプトを組み立てる際に使用する。

        **科目詳細に含まれるデータ:**
        - `finalTarget` — 科目の最終目標（SubjectSettings）
        - `monthlyGoal` — 指定月の今月の方針（SubjectMonthlyGoal）
        - `studyMinutes` — 指定月の学習時間（分）
        - `problemCount` — 習熟度 △/× の弱点問題数
        - `failureStats` — ミスの種類別の件数と割合

        `year`/`month` を省略すると現在の年月が使用される。
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: '対象年（省略時: サーバー現在年）'
        - name: month
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
          description: '対象月（省略時: サーバー現在月）'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeminiContext' }
              example:
                year: 2026
                month: 5
                dashboard:
                  currentStreak: 12
                  allTotalMinutes: 14400
                  thisMonthMinutes: 960
                  subjectMinutes:
                    - { subject: '財務・会計', minutes: 480 }
                    - { subject: '企業経営理論', minutes: 480 }
                subjects:
                  - subject: '財務・会計'
                    finalTarget: '70点以上で科目合格'
                    monthlyGoal: '手薄な連結会計を重点的に'
                    studyMinutes: 480
                    problemCount: 23
                    failureStats:
                      - { type: '定義ミス', count: 10, ratio: 0.50 }
                      - { type: '解法ミス', count: 7,  ratio: 0.35 }
                      - { type: '計算ミス', count: 3,  ratio: 0.15 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /gemini/settings:
    get:
      summary: Gemini設定を取得
      tags: [AI]
      description: ユーザーが設定した使用モデル名を返す。未設定の場合は `geminiModel` が `null`。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [geminiModel]
                properties:
                  geminiModel:
                    type: string
                    nullable: true
                    description: '使用モデル名（例: gemini-2.5-flash, gemini-2.5-pro）'
              example:
                geminiModel: 'gemini-2.5-flash'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      summary: Gemini設定を更新
      tags: [AI]
      description: |
        使用モデル名を保存する。`ai_user_profiles` に upsert される。
        設定後の Gemini 呼び出し（AIアドバイス・画像解析・朝の復習）すべてにこのモデルが使用される。
        環境変数 `GEMINI_MODEL` がデフォルトとして使用され、この設定で上書きされる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [geminiModel]
              properties:
                geminiModel:
                  type: string
                  maxLength: 100
                  description: '使用モデル名'
            example:
              geminiModel: 'gemini-2.5-pro'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [geminiModel]
                properties:
                  geminiModel:
                    type: string
                    nullable: true
                    description: '保存されたモデル名'
              example:
                geminiModel: 'gemini-2.5-pro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Morning Bugfix ───────────────────────────────────────────────────────────

  /morning-bugfix:
    get:
      summary: 朝の定義ミス復習セッションを取得
      tags: [AI]
      description: |
        昨日触れた「定義ミス」の苦手問題を優先的に抽出し、Geminiで定義理解クイズを生成して返す。

        **問題選出フォールバック（合計5問）:**
        1. `last_touched_at == 昨日` かつ `failure_types` に `定義ミス` を含む（RANDOM）
        2. 直近7日以内の定義ミス（昨日を除く）で補填（RANDOM）
        3. それでも不足する場合、全期間の定義ミスを習熟度の低い順（×→△→○）で補填

        `date` パラメータを指定すると、その日を「今日」とみなして昨日を計算する（テスト用）。
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: '基準日（省略時: サーバー今日）'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MorningBugfixSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  # ── AI Advice ────────────────────────────────────────────────────────────────

  /ai/advice:
    post:
      summary: AIアドバイスを生成
      tags: [AI]
      description: |
        ユーザーの学習ログ・苦手問題・目標データをもとに Gemini API を呼び出し、
        モード別のアドバイスを生成して返す。

        | モード | 内容 |
        |---|---|
        | `ANALYSIS` | 今週の達成率・残り時間を算出し、時間ブロック配置案を提案 |
        | `INSPIRATION` | 客観的な事実で学習努力を称える |
        | `ANALOGY` | 試験概念を趣味に例えて解説 |
        | `WARNING` | 危機感を煽る冷徹な鬼コーチ |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/AiAdviceMode'
            examples:
              analysis:
                summary: ANALYSISモード
                value: { mode: ANALYSIS }
              inspiration:
                summary: INSPIRATIONモード
                value: { mode: INSPIRATION }
      responses:
        '200':
          description: アドバイス生成成功
          content:
            application/json:
              schema:
                type: object
                required: [advice]
                properties:
                  advice:
                    type: string
                    description: 生成されたアドバイス（100〜250文字程度）
                    example: '今週は財務・会計に集中しているが、法務が0分。残り12時間のうち3時間を法務に充て、過去問2年分を解くことで弱点を一気に潰せる。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: modeが不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'The given data was invalid.', errors: { mode: ['modeは ANALYSIS, INSPIRATION, ANALOGY, WARNING のいずれかを指定してください。'] } }
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  /ai/analysis:
    post:
      summary: 問題画像を解析して苦手問題に登録
      tags: [AI]
      description: |
        アップロードされた試験問題の画像を Gemini 1.5 Flash でマルチモーダル解析し、
        科目・問題番号・要点・失敗タイプを自動抽出して苦手問題 (Problem) として保存する。

        - 習熟度は `×`（未習得）で固定
        - `solved_at` は本日の日付
        - 科目が未登録の場合は自動作成
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: 問題画像（JPEG / PNG / WebP / HEIC、最大 10MB）
                memo:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: 解答時のユーザーメモ。指定するとGeminiのノート生成に間違えた原因・改善ポイントが追加される。
      responses:
        '201':
          description: 解析成功・苦手問題として保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: バリデーションエラー（ファイル形式・サイズ不正など）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'The given data was invalid.', errors: { image: ['画像ファイルは必須です。'] } }
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '500':
          description: Gemini が期待する JSON を返さなかった場合など
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Gemini returned invalid JSON' }
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  # ── Practice sessions ────────────────────────────────────────────────────────

  /practice/sessions/draft:
    put:
      summary: 演習ドラフトを保存（途中再開用）
      tags: [Practice]
      description: |
        演習途中の状態を保存する。同一科目のドラフトが存在する場合は上書きする。
        フロントエンドは回答のたびに呼び出すことで、アプリ終了後の再開を可能にする。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
      responses:
        '204':
          description: 保存成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /practice/sessions/draft/{subject}:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 演習ドラフトを取得
      tags: [Practice]
      responses:
        '200':
          description: ドラフトが存在する
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ドラフトなし（演習未開始または完了・削除済み）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: '指定された科目のドラフトが見つかりません。' }
    delete:
      summary: 演習ドラフトを削除（完了・破棄時）
      tags: [Practice]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  /practice/sessions:
    post:
      summary: 演習セッションを保存する
      tags: [Practice]
      description: |
        一問一答演習の結果を保存する。
        バックエンドは受け取った totalElapsedMs を分単位（切り上げ）に変換し、
        該当日の DailyLog に StudySession を自動生成することを推奨する。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionInput' }
      responses:
        '201':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /auth/logout:
    post:
      summary: ログアウト
      tags: [Auth]
      description: |
        現在使用中のアクセストークンを削除し、セッションを終了します。
        内部的には Laravel Sanctum の `currentAccessToken()->delete()` を実行します。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログアウトしました。
        '401':
          $ref: '#/components/responses/Unauthorized'
