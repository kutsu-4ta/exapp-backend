openapi: 3.0.3
info:
  title: Exapp API
  description: 中小企業診断士 学習管理アプリ API仕様書
  version: 0.3.0

servers:
  - url: /api
    description: Next.js proxy (→ backend)

# ルートレベルで認証を有効化（全体適用）
security:
  - bearerAuth: [ ]

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: 未認証（トークン未送信または期限切れ）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Unauthenticated.' }

    NotFound:
      description: 指定されたリソースが見つからない
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: '指定されたリソースが見つかりません。' }

    UnprocessableEntity:
      description: バリデーションエラー
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            message: 'The given data was invalid.'
            errors:
              field: [ 'フィールドは必須です。' ]

    Conflict:
      description: リソースが既に存在する、または競合が発生した
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: '同じ名前のリソースが既に存在します。' }

    GeminiUnavailable:
      description: Gemini APIが応答しない（busy / 地域制限）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: 'Gemini is busy (503)' }

    GeminiQuotaExceeded:
      description: Gemini APIの利用上限超過
      content:
        application/json:
          schema:
            type: object
            required: [ code, message ]
            properties:
              code: { type: string, example: 'GEMINI_QUOTA_EXCEEDED' }
              message: { type: string, example: 'AIの利用上限に達しました。しばらく時間をおいてから再試行してください。' }

  schemas:
    StopwatchState:
      type: object
      required: [ isRunning, elapsedSeconds ]
      properties:
        isRunning:
          type: boolean
          description: 現在計測中かどうか
        elapsedSeconds:
          type: integer
          description: |
            累積秒数。`isRunning = true` の場合は `保存済み秒数 + (現在時刻 - started_at)` を加算済みの値を返す。

    UserProfile:
      type: object
      properties:
        nickname: { type: string, nullable: true }
        occupation: { type: string, nullable: true }
        goal: { type: string, nullable: true }
        weakAreas: { type: string, nullable: true }
        strongAreas: { type: string, nullable: true }
        interests: { type: string, nullable: true }
        geminiTokenSet: { type: boolean, description: '個別Geminiトークンが登録済みかどうか（トークン本体は返さない）' }

    UserProfileInput:
      type: object
      properties:
        nickname: { type: string, nullable: true, maxLength: 50 }
        occupation: { type: string, nullable: true, maxLength: 100 }
        goal: { type: string, nullable: true, maxLength: 500 }
        weakAreas: { type: string, nullable: true, maxLength: 500, description: '苦手科目（カンマ区切り等、自由記述）' }
        strongAreas: { type: string, nullable: true, maxLength: 500, description: '得意科目（カンマ区切り等、自由記述）' }
        interests: { type: string, nullable: true, maxLength: 500, description: '趣味・嗜好' }
        geminiToken: { type: string, nullable: true, maxLength: 200, description: 'ユーザー個別のGemini APIキー（保存時に暗号化）' }

    AiAdviceMode:
      type: string
      enum: [ ANALYSIS, INSPIRATION, ANALOGY, WARNING ]
      description: |
        AIアドバイスのモード。
        - ANALYSIS: 目標達成率と時間ブロック配置を論理的に分析
        - INSPIRATION: 客観的な事実で学習努力を称える
        - ANALOGY: 試験概念を趣味に例えて解説
        - WARNING: 危機感を煽る冷徹な鬼コーチ

    TimeSlot:
      type: string
      enum: [ morning, lunch, night ]
    Subject:
      type: string
      description: ユーザーが定義した科目名
    Material:
      type: string
      description: ユーザーが定義した教材名

    AlertStatusItem:
      type: object
      required: [ subject, lastDate, recentMinutes, settings ]
      properties:
        subject:
          type: string
          description: '科目名'
        lastDate:
          type: string
          format: date
          nullable: true
          description: '最終学習日。未学習の場合は null'
        recentMinutes:
          type: integer
          description: '直近 settings.minutesThresholdDays 日間の学習時間（分）'
        settings:
          $ref: '#/components/schemas/SubjectAlertSettings'
          description: 'この科目のアラート設定。未設定の場合はデフォルト値'

    SubjectAlertSettings:
      type: object
      required: [ touchAlertEnabled, thresholdDays, includeUntouched, minutesAlertEnabled, minutesThresholdDays, minutesThreshold ]
      properties:
        touchAlertEnabled:
          type: boolean
          description: '条件1（未接触アラート）をこの科目で有効にするか'
        thresholdDays:
          type: integer
          minimum: 1
          description: '条件1: 何日間学習がなければ警告するか'
        includeUntouched:
          type: boolean
          description: '条件1: 一度も学習していない場合も警告対象にするか'
        minutesAlertEnabled:
          type: boolean
          description: '条件2（学習時間不足アラート）をこの科目で有効にするか'
        minutesThresholdDays:
          type: integer
          minimum: 1
          description: '条件2: 直近何日間の学習時間を判定するか'
        minutesThreshold:
          type: integer
          minimum: 1
          description: '条件2: 何分未満なら警告するか'

    SubjectSettings:
      type: object
      properties:
        finalTarget: { type: string, nullable: true, maxLength: 500, description: '最終目標（科目全体）' }
        themeColor: { type: string, nullable: true, pattern: '^#[0-9a-fA-F]{6}$', description: 'テーマカラー（16進数 #rrggbb）。nullの場合は科目名ハッシュから自動生成' }

    SubjectMonthlyGoal:
      type: object
      required: [ year, month ]
      properties:
        year: { type: integer, description: '対象年' }
        month: { type: integer, minimum: 1, maximum: 12, description: '対象月' }
        goal: { type: string, nullable: true, maxLength: 1000, description: '今月の方針' }

    SubCategoryRank:
      type: string
      enum: [ A, B, C, D, E ]
      description: '小分類のランク（A が最重要）'

    SubCategory:
      type: object
      required: [ id, subject, name, rank, createdAt, updatedAt ]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string }
        rank:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SubCategoryRank'
          description: 'ランク（A〜E / 未設定は null）'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubCategoryInput:
      type: object
      required: [ subject, name ]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string }
        rank:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SubCategoryRank'
          description: 'ランク（A〜E / 未設定は null）'

    MonthlySettings:
      type: object
      required: [ year, month, targetMin, targetMax ]
      properties:
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        targetMin: { type: number, description: '月間目標下限（時間）' }
        targetMax: { type: number, description: '月間目標上限（時間）' }

    MonthlySettingsInput:
      type: object
      required: [ targetMin, targetMax ]
      properties:
        targetMin: { type: number, description: '月間目標下限（時間）' }
        targetMax: { type: number, description: '月間目標上限（時間）' }

    StudySession:
      type: object
      required: [ id, dailyLogDate, timeSlot, minutes, subject, material ]
      properties:
        id: { type: integer }
        dailyLogDate: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PracticeSessionInput:
      type: object
      required: [ subject, date, totalElapsedMs, questions ]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        date: { type: string, format: date }
        totalElapsedMs: { type: integer, minimum: 0, description: '演習全体の経過時間（ミリ秒）' }
        questions:
          type: array
          items:
            type: object
            required: [ index, judgement, elapsedMs ]
            properties:
              index: { type: integer, description: '問題番号（1始まり）' }
              judgement: { type: string, description: '回答（複数設問はカンマ区切り、例: "ア,イ"）' }
              elapsedMs: { type: integer, minimum: 0, description: 'この問題にかかった時間（ms）' }
              note: { type: string, nullable: true, description: '選択した選択肢のメモ（複数設問は改行結合）' }
              memos:
                type: array
                description: '設問ごとの全選択肢メモ（judgement の順に対応）'
                items:
                  type: object
                  additionalProperties: { type: string }
                  description: '選択肢をキー、メモ本文を値とするオブジェクト（例: {"ア": "〜", "イ": "〜"}）'

    PracticeAnswerRecord:
      type: object
      required: [ index, answers, elapsedMs ]
      properties:
        index: { type: integer, description: '問題番号（1始まり）' }
        answers:
          type: array
          items:
            type: object
            required: [ answer, isDoubtful ]
            properties:
              answer: { type: string, description: '選択肢（ア〜オ）または記述テキスト' }
              isDoubtful: { type: boolean }
              note: { type: string, nullable: true, description: '選択した選択肢のメモ' }
              memos:
                type: object
                additionalProperties: { type: string }
                description: '全選択肢のメモ（例: {"ア": "〜", "イ": "〜"}）'
        elapsedMs: { type: integer, minimum: 0, description: 'この問題にかかった時間（ms）' }

    PracticeSessionDraft:
      type: object
      required: [ subject, currentIndex, log ]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        currentIndex: { type: integer, minimum: 1, description: '次に解く問題番号' }
        log:
          type: array
          items: { $ref: '#/components/schemas/PracticeAnswerRecord' }

    PracticeSessionResult:
      type: object
      required: [ id, subject, date, totalMinutes ]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        date: { type: string, format: date }
        totalMinutes: { type: integer, description: '切り上げ後の分数（WorkspaceのStudySession作成に使用）' }

    StudySessionInput:
      type: object
      required: [ timeSlot, minutes, subject, material ]
      properties:
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        memo: { type: string, nullable: true }

    DailyLog:
      type: object
      required: [ date, isCompleted, studySessions ]
      properties:
        date: { type: string, format: date }
        reflection: { type: string, nullable: true }
        isCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        studySessions:
          type: array
          items: { $ref: '#/components/schemas/StudySession' }
        totalMinutes: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DailyLogSummary:
      type: object
      required: [ date, isCompleted, totalMinutes ]
      properties:
        date: { type: string, format: date }
        isCompleted: { type: boolean }
        totalMinutes: { type: integer }
        sessionCount: { type: integer }

    Proficiency:
      type: string
      enum: [ '○', '△', '×' ]

    FailureType:
      type: string
      enum: [ '定義', '解法', 'ケアレス' ]

    Problem:
      type: object
      required: [ id, subject, material, questionRef, proficiency, failureTypes, isGoodQuestion, isFormula, solvedAt, createdAt, updatedAt ]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        isFormula: { type: boolean, description: '公式・定義フラグ。true の場合 /flash-card?formulaOnly=true の対象になる' }
        solvedAt: { type: string, format: date }
        lastTouchedAt: { type: string, format: date-time, nullable: true, description: '直近にレビュー（今日の5問で確認）した日時。PUT /problems/:id で自動更新される' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProblemQuiz:
      type: object
      description: Problem に紐づく良問クイズ（FlashBugfix セッション中に「良問」登録されたクイズデータ）
      required: [ id, problemId, quizType, question, explanation, createdAt ]
      properties:
        id: { type: integer }
        problemId: { type: integer }
        quizType:
          type: string
          enum: [ multiple_choice, word_card ]
          description: 'multiple_choice: 選択式 / word_card: 単語カード（表裏のみ）'
        question: { type: string }
        options: { type: array, items: { type: string }, description: 'multiple_choice のみ。word_card の場合は空配列または省略' }
        correctIndex: { type: integer, nullable: true, description: '正解の選択肢インデックス（0始まり）。word_card の場合は null' }
        explanation: { type: string }
        createdAt: { type: string, format: date-time }

    ProblemQuizInput:
      type: object
      required: [ quizType, question, explanation ]
      description: |
        `quizType` によって必須フィールドが変わる。
        - `multiple_choice`: `options`（minItems: 2）と `correctIndex` が必須
        - `word_card`: `options` と `correctIndex` は不要（省略可）
      properties:
        quizType:
          type: string
          enum: [ multiple_choice, word_card ]
          description: 'multiple_choice: 選択式 / word_card: 単語カード'
        question: { type: string }
        options: { type: array, items: { type: string }, description: 'multiple_choice のみ必須（minItems: 2）' }
        correctIndex: { type: integer, nullable: true, description: '正解の選択肢インデックス（0始まり）。multiple_choice のみ必須' }
        explanation: { type: string }

    ProblemInput:
      type: object
      required: [ subject, questionRef, proficiency, failureTypes, isGoodQuestion, solvedAt ]
      description: |
        `materialId` と `materialName` のどちらか一方が必須。
        - `materialId` が指定された場合は既存の教材を使用する。
        - `materialId` が null で `materialName` が指定された場合は新規作成する。
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        materialId: { type: integer, nullable: true, description: '既存教材の ID（materialName と排他）' }
        materialName: { type: string,  nullable: true, maxLength: 255, description: '新規作成する教材名（materialId と排他）' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        isFormula: { type: boolean, description: '公式・定義フラグ（省略時は false）' }
        solvedAt: { type: string, format: date }

    DashboardStats:
      type: object
      required: [ thisWeekTotalMinutes, allTotalMinutes, thisMonthMinutes, thisMonthDays, last7DaysMinutes, weeklyAvgMinutes, subjectMinutes, allSubjectMinutes, lastTouchedBySubject, dailyMinutes ]
      properties:
        thisWeekTotalMinutes: { type: integer }
        currentStreak: { type: integer }
        allTotalMinutes: { type: integer }
        allTotalDays: { type: integer }
        thisMonthMinutes: { type: integer }
        thisMonthDays: { type: integer }
        last7DaysMinutes: { type: integer }
        weeklyAvgMinutes: { type: number, format: float }
        subjectMinutes:
          type: array
          items:
            type: object
            required: [ subject, minutes ]
            properties:
              subject: { type: string }
              minutes: { type: integer }
        allSubjectMinutes:
          type: array
          items:
            type: object
            required: [ subject, minutes ]
            properties:
              subject: { type: string }
              minutes: { type: integer }
        lastTouchedBySubject:
          type: array
          description: '全科目の最終学習日一覧。アラート判定には GET /api/subjects/alert-status を使用すること'
          items:
            type: object
            required: [ subject, lastDate ]
            properties:
              subject: { type: string }
              lastDate: { type: string, format: date, nullable: true }
        dailyMinutes:
          type: array
          items:
            type: object
            required: [ date, minutes ]
            properties:
              date: { type: string, format: date }
              minutes: { type: integer }

    SubjectActivityDay:
      type: object
      required: [ date, studyMinutes, problemCount ]
      properties:
        date: { type: string, format: date, description: '対象日（YYYY-MM-DD）' }
        studyMinutes: { type: integer, description: 'その日の該当科目の学習時間（分）' }
        problemCount: { type: integer, description: 'その日に追加された苦手問題の数（solvedAt 一致）' }

    GeminiContextSubject:
      type: object
      description: 科目ごとのGeminiコピー用詳細データ
      required: [ subject, studyMinutes, problemCount, failureStats ]
      properties:
        subject:
          type: string
        finalTarget:
          type: string
          nullable: true
          description: '最終目標（SubjectSettings.finalTarget）'
        monthlyGoal:
          type: string
          nullable: true
          description: '今月の方針（SubjectMonthlyGoal.goal — year/month に対応）'
        studyMinutes:
          type: integer
          description: '指定月の学習時間（分）'
        problemCount:
          type: integer
          description: '習熟度が △ または × の弱点問題数'
        failureStats:
          type: array
          description: 'ミスの種類別の件数と割合（問題あたりの failureTypes をカウント）'
          items:
            type: object
            required: [ type, count, ratio ]
            properties:
              type: { $ref: '#/components/schemas/FailureType' }
              count: { type: integer, description: '該当ミス種別の件数' }
              ratio: { type: number, format: float, minimum: 0, maximum: 1, description: '全ミス件数に対する割合（0.0〜1.0）' }
        recentExamScore:
          type: object
          nullable: true
          description: '直近の完了済み過去問スコア。未実施なら null'
          required: [ examYear, score ]
          properties:
            examYear: { type: integer, description: '過去問の年度' }
            score: { type: integer, description: '獲得点数（is_correct=true の point 合計）' }
            completedAt: { type: string, format: date, nullable: true, description: '完了日' }

    GeminiContextDailyLog:
      type: object
      description: '直近7日間の日別学習サマリ'
      required: [ date, studyMinutes ]
      properties:
        date:
          type: string
          format: date
          description: '日付（YYYY-MM-DD）'
        studyMinutes:
          type: integer
          description: '当日の総学習時間（分）。記録なしは 0'
        reflection:
          type: string
          nullable: true
          description: 'その日の振り返りメモ'

    GeminiContext:
      type: object
      description: |
        Geminiコピー用の集約コンテキスト。
        ダッシュボード統計・プロフィール・直近7日ログ・全科目詳細を1リクエストで返す。
      required: [ year, month, profile, dashboard, recentDailyLogs, subjects ]
      properties:
        year:
          type: integer
          description: '集計対象年'
        month:
          type: integer
          minimum: 1
          maximum: 12
          description: '集計対象月'
        profile:
          type: object
          description: 'ユーザープロフィール（user_profiles から取得）'
          properties:
            occupation: { type: string, nullable: true, description: '職業' }
            goal: { type: string, nullable: true, description: '学習目標' }
            weakAreas: { type: string, nullable: true, description: '苦手分野' }
            strongAreas: { type: string, nullable: true, description: '得意分野' }
        dashboard:
          $ref: '#/components/schemas/DashboardStats'
          description: 'ダッシュボード集計（subjectMinutes 等は指定月ベース）'
        recentDailyLogs:
          type: array
          description: '直近7日間の日別ログ（記録がない日は studyMinutes=0, reflection=null で補填）'
          items:
            $ref: '#/components/schemas/GeminiContextDailyLog'
        subjects:
          type: array
          description: '登録済み科目ごとの詳細（studyMinutes = 0 の科目も含む）'
          items:
            $ref: '#/components/schemas/GeminiContextSubject'

    MorningQuizItem:
      type: object
      required: [ id, subject, problem_context, quiz ]
      properties:
        id: { type: integer }
        subject: { type: string }
        sub_category: { type: string, nullable: true }
        problem_context:
          type: object
          properties:
            original_ref: { type: string, nullable: true }
            user_memo: { type: string, nullable: true }
            material_name: { type: string, nullable: true, description: '教材名' }
        quiz:
          type: object
          nullable: true
          properties:
            question: { type: string }
            options: { type: array, items: { type: string } }
            correct_index: { type: integer, minimum: 0, maximum: 3 }
            explanation: { type: string }
        last_touched_at: { type: string, format: date, nullable: true }

    TouchedOrder:
      type: string
      enum: [ recent, old ]
      description: 'recent: 最近触れた問題を優先 / old: 長く触れていない問題を優先'

    MorningBugfixSession:
      type: object
      required: [ session_id, meta, questions ]
      properties:
        session_id: { type: string, example: 'morning_bugfix_20260512' }
        meta:
          type: object
          properties:
            total_questions: { type: integer }
            strategy:
              type: string
              enum: [ definition_focused, flash_bugfix, word_card, formula_check ]
              description: 'definition_focused: Morning Bugfix / flash_bugfix: Flash Bugfix 一問一答 / word_card: 単語カード / formula_check: 公式チェック'
        questions:
          type: array
          items: { $ref: '#/components/schemas/MorningQuizItem' }

    Error:
      type: object
      required: [ message ]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # ── Exam ────────────────────────────────────────────────────────────────────

    Rank:
      type: string
      enum: [ A, B, C, D, E ]
      description: 問題の重要度ランク（A=最重要〜E=低優先）

    ExamSessionStatus:
      type: string
      enum: [ in_progress, scoring, completed ]
      description: 'in_progress: 解答中, scoring: 自己採点中, completed: 完了'

    ExamQuestion:
      type: object
      required: [ id, examSessionId, sortOrder, displayId, isSub, hasChildren, rank, isDoubtful, point ]
      properties:
        id: { type: integer }
        examSessionId: { type: integer }
        sortOrder: { type: integer, description: '表示順（0始まり）' }
        displayId: { type: string, description: '第1問・設問1 など表示用ID' }
        isSub: { type: boolean, description: '設問（小問）かどうか' }
        hasChildren: { type: boolean, description: '小問を持つ親問かどうか' }
        rank: { $ref: '#/components/schemas/Rank' }
        myAnswer: { type: string, nullable: true, description: 'ア〜オ または記述解答（未回答時はnull）' }
        answeredTimeMs: { type: integer, nullable: true, description: 'サーバー確定の回答時間（ミリ秒）' }
        answeredStartedAt: { type: string, format: date-time, nullable: true, description: '回答開始時刻（UTC ISO8601）' }
        answeredFinishedAt: { type: string, format: date-time, nullable: true, description: '回答確定時刻（UTC ISO8601）' }
        isCorrect: { type: boolean, nullable: true, description: '正誤（null=未採点）' }
        isDoubtful: { type: boolean, description: '要復習フラグ' }
        point: { type: integer, description: '配点' }
        note: { type: string, nullable: true, description: 'ミスメモ' }

    ExamQuestionInput:
      type: object
      required: [ sortOrder, displayId, isSub, hasChildren, rank, isDoubtful, point ]
      description: |
        試験完了時に送信する問題データ。
        `answeredStartedAt` と `answeredFinishedAt` を両方送ると、サーバーが `answeredTimeMs` を計算する。
        タイムスタンプがない場合は `answeredTimeMs` のフォールバック値を使用。
      properties:
        sortOrder: { type: integer }
        displayId: { type: string }
        isSub: { type: boolean }
        hasChildren: { type: boolean }
        rank: { $ref: '#/components/schemas/Rank' }
        myAnswer: { type: string, nullable: true }
        isCorrect: { type: boolean, nullable: true }
        isDoubtful: { type: boolean }
        point: { type: integer }
        note: { type: string, nullable: true }
        answeredTimeMs: { type: integer, nullable: true, description: 'フォールバック用（タイムスタンムがある場合はサーバーが上書き計算）' }
        answeredStartedAt: { type: string, format: date-time, nullable: true, description: '回答開始時刻（UTC ISO8601）' }
        answeredFinishedAt: { type: string, format: date-time, nullable: true, description: '回答確定時刻（UTC ISO8601）' }

    ExamSession:
      type: object
      required: [ id, subject, examYear, status, questions, totalScore, pureScore, correctCount, incorrectCount, doubtfulCount, createdAt ]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        examYear: { type: string, example: 'R07', description: '受験年度（R07 等）' }
        status: { $ref: '#/components/schemas/ExamSessionStatus' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ExamQuestion' }
        totalScore: { type: integer, readOnly: true, description: '採点後の合計得点' }
        pureScore: { type: integer, readOnly: true, description: '要復習を除いた純粋な得点' }
        correctCount: { type: integer, readOnly: true }
        incorrectCount: { type: integer, readOnly: true }
        doubtfulCount: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ExamSessionSummary:
      type: object
      required: [ id, subject, examYear, totalScore, pureScore, createdAt ]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        examYear: { type: string }
        totalScore: { type: integer }
        pureScore: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ExamMistakeNote:
      type: object
      required: [ questionId, sessionId, examYear, displayId, rank, note, isDoubtful, completedAt ]
      properties:
        questionId: { type: integer }
        sessionId: { type: integer }
        examYear: { type: string }
        displayId: { type: string }
        rank: { $ref: '#/components/schemas/Rank' }
        note: { type: string }
        isDoubtful: { type: boolean }
        completedAt: { type: string, format: date-time }

    ExamRankStat:
      type: object
      required: [ rank, correctRate, count ]
      properties:
        rank: { $ref: '#/components/schemas/Rank' }
        correctRate: { type: number, format: float, minimum: 0, maximum: 1 }
        count: { type: integer, description: '該当ランクの問題数' }

    ExamSubjectStats:
      type: object
      required: [ subject, sessionCount, avgTotalScore, avgPureScore, rankStats, recentMistakes ]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        sessionCount: { type: integer }
        avgTotalScore: { type: number, format: float }
        avgPureScore: { type: number, format: float }
        rankStats:
          type: array
          items: { $ref: '#/components/schemas/ExamRankStat' }
        recentMistakes:
          type: array
          items: { $ref: '#/components/schemas/ExamMistakeNote' }
          description: '直近10件のミスメモ（note が入力されているもの）'

    Flashcard:
      type: object
      required: [ id, front, back ]
      properties:
        id: { type: integer }
        lastTouchedAt: { type: string, format: date, nullable: true, description: '最終演習日（未演習はnull）' }
        subject: { $ref: '#/components/schemas/Subject' }
        front:
          type: object
          required: [ questionRef, solvedAt ]
          properties:
            questionRef: { type: string, description: '問題番号（例: 第12問）' }
            subCategory: { type: string, nullable: true, description: '小分類名' }
            material: { type: string, nullable: true, description: '教材名' }
            solvedAt: { type: string, format: date, description: '解答日' }
        back:
          type: object
          required: [ proficiency, failureTypes, isGoodQuestion ]
          properties:
            note: { type: string, nullable: true, description: '復習ノート（解法パターン・判断軸）' }
            proficiency: { $ref: '#/components/schemas/Proficiency' }
            failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
            isGoodQuestion: { type: boolean }
            isFormula: { type: boolean, description: '公式・定義フラグ（省略時は false）' }

    # ── Sprint ────────────────────────────────────────────────────────────────────

    SprintType:
      type: string
      enum: [ backlog, active ]
      description: |
        - `backlog`: バックログ（ユーザーごとに1件、削除・完了不可）
        - `active`: 通常スプリント

    SprintStatus:
      type: string
      enum: [ active, completed ]

    Sprint:
      type: object
      required: [ id, name, type, status, createdAt ]
      properties:
        id: { type: integer }
        name: { type: string }
        goal: { type: string, nullable: true, maxLength: 500, description: 'スプリントのテーマ・ゴール' }
        retrospective: { type: string, nullable: true, description: 'スプリント完了時の振り返り（Markdown）' }
        type: { $ref: '#/components/schemas/SprintType' }
        status: { $ref: '#/components/schemas/SprintStatus' }
        startDate: { type: string, format: date, nullable: true }
        endDate: { type: string, format: date, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    SprintInput:
      type: object
      required: [ name, startDate, endDate ]
      properties:
        name: { type: string, maxLength: 100, example: '第1回スプリント' }
        goal: { type: string, maxLength: 500, description: 'スプリントのテーマ・ゴール（任意）' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    SprintUpdateInput:
      type: object
      properties:
        name: { type: string, maxLength: 100 }
        goal: { type: string, nullable: true, maxLength: 500 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }

    SprintSubCategoryStats:
      type: object
      required: [ subCategoryId, subCategoryName, total, done ]
      properties:
        subCategoryId: { type: integer }
        subCategoryName: { type: string }
        total: { type: integer, description: 'スプリント内のチケット総数' }
        done: { type: integer, description: '完了済みチケット数' }

    SprintStats:
      type: object
      required: [ sprintId, sprintName, total, done, doing, todo, completionRate, bySubCategory ]
      properties:
        sprintId: { type: integer }
        sprintName: { type: string }
        total: { type: integer, description: 'チケット総数' }
        done: { type: integer, description: '完了数' }
        doing: { type: integer, description: '着手中数' }
        todo: { type: integer, description: '未着手数' }
        completionRate:
          type: number
          format: float
          minimum: 0
          maximum: 100
          description: '消化率（%）= done / total × 100'
        avgCompleteDays:
          type: number
          format: float
          nullable: true
          description: '作成から完了までの平均日数。完了チケットがない場合は null'
        bySubCategory:
          type: array
          items: { $ref: '#/components/schemas/SprintSubCategoryStats' }
          description: '小分類別の集計（1チケットが複数小分類を持つ場合は各小分類にカウント）'

    # ── StudyTicket ───────────────────────────────────────────────────────────────

    TicketStatus:
      type: string
      enum: [ todo, doing, done ]

    TicketPriority:
      type: string
      enum: [ high, medium, low ]

    TicketType:
      type: string
      enum: [ knowledge, practice, understanding, memorization ]
      description: |
        - `knowledge`: 知識補強型（整理・比較）
        - `practice`: 演習型（N問連続正解など）
        - `understanding`: 理解整理型（説明できるレベルまで）
        - `memorization`: 暗記型（用語・数字）

    TicketSource:
      type: string
      enum: [ wrong_answer, mock_exam, review, manual ]
      description: |
        - `wrong_answer`: 過去問ミスから発生
        - `mock_exam`: 模試から発生
        - `review`: 定期見直しから発生
        - `manual`: 手動作成

    TicketSubCategoryRef:
      type: object
      required: [ id, name ]
      properties:
        id: { type: integer }
        name: { type: string }
        subject: { type: string, nullable: true, description: '親科目名' }

    StudyTicket:
      type: object
      required: [ id, sprintId, subject, title, acceptanceCriteria, dueDate, status, priority, ticketType, source, subCategories, createdAt ]
      properties:
        id: { type: integer }
        sprintId: { type: integer }
        subject: { type: string, description: '紐づく科目名' }
        title: { type: string }
        acceptanceCriteria: { type: string, description: '達成条件（曖昧な表現禁止）' }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        ticketType: { $ref: '#/components/schemas/TicketType' }
        source: { $ref: '#/components/schemas/TicketSource' }
        estimateMinutes: { type: integer, nullable: true, minimum: 1, maximum: 480 }
        subCategories:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TicketSubCategoryRef' }
        completedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    StudyTicketInput:
      type: object
      required: [ subject, title, acceptanceCriteria, dueDate, priority, ticketType, source, subCategoryIds ]
      properties:
        sprintId:
          type: integer
          nullable: true
          description: '省略またはnullの場合はバックログに追加される'
        subject: { type: string, description: '紐づく科目名（必須）' }
        title: { type: string, maxLength: 255 }
        acceptanceCriteria: { type: string, description: '達成条件（具体的に記述）' }
        dueDate: { type: string, format: date }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        ticketType: { $ref: '#/components/schemas/TicketType' }
        source: { $ref: '#/components/schemas/TicketSource' }
        estimateMinutes: { type: integer, nullable: true, minimum: 1, maximum: 480 }
        subCategoryIds:
          type: array
          minItems: 1
          items: { type: integer }
          description: '小分類IDの配列（1つ以上必須、選択した科目に属するものに限る）'

    StudyTicketUpdateInput:
      type: object
      properties:
        subject: { type: string, description: '紐づく科目名' }
        title: { type: string, maxLength: 255 }
        acceptanceCriteria: { type: string }
        dueDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/TicketStatus' }
        priority: { $ref: '#/components/schemas/TicketPriority' }
        ticketType: { $ref: '#/components/schemas/TicketType' }
        source: { $ref: '#/components/schemas/TicketSource' }
        estimateMinutes: { type: integer, nullable: true, minimum: 1, maximum: 480 }
        subCategoryIds:
          type: array
          minItems: 1
          items: { type: integer }
          description: '送信した場合は全量置き換え（sync）'

    # ── TicketNote ───────────────────────────────────────────────────────────────

    TicketNote:
      type: object
      required: [ id, ticketId, body, createdAt, updatedAt ]
      properties:
        id: { type: integer }
        ticketId: { type: integer }
        body: { type: string, description: 'ノート本文（Markdown可）' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TicketNoteInput:
      type: object
      required: [ body ]
      properties:
        body: { type: string, maxLength: 2000, description: 'ノート本文' }

    Snippet:
      type: object
      required: [ id, title, content ]
      properties:
        id: { type: integer }
        title: { type: string, maxLength: 60 }
        content: { type: string, maxLength: 2000 }

    SnippetInput:
      type: object
      required: [ title, content ]
      properties:
        title: { type: string, maxLength: 60 }
        content: { type: string, maxLength: 2000 }


paths:
  # ── Stopwatch ─────────────────────────────────────────────────────────────────

  /stopwatch:
    get:
      summary: ストップウォッチの現在状態を取得
      tags: [ Stopwatch ]
      description: |
        `is_running = true` の場合、`elapsed_seconds` には
        `保存済み累積秒数 + (現在時刻 - started_at)` を加算した値を返す。
        フロントはこの値をそのまま表示すればよい。
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopwatchState' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stopwatch/start:
    post:
      summary: ストップウォッチを開始
      tags: [ Stopwatch ]
      description: |
        `is_running = true` にして `started_at` をサーバー現在時刻で記録する。
        すでに計測中の場合は **409 Conflict** を返す。
        `elapsed_seconds` はリセットしない（累積）。
      responses:
        '200':
          description: 開始成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopwatchState' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'

  /stopwatch/stop:
    post:
      summary: ストップウォッチを停止
      tags: [ Stopwatch ]
      description: |
        `elapsed_seconds += (現在時刻 - started_at)` を加算し、
        `is_running = false`、`started_at = null` にする。
        すでに停止中の場合は何もせず現在の状態を返す。
      responses:
        '200':
          description: 停止成功（または停止済みのまま）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopwatchState' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /stopwatch/reset:
    post:
      summary: ストップウォッチをリセット
      tags: [ Stopwatch ]
      description: |
        `elapsed_seconds = 0`、`is_running = false`、`started_at = null` にリセットする。
        計測中・停止中いずれの状態でもリセット可能。
      responses:
        '200':
          description: リセット成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StopwatchState' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Subjects ─────────────────────────────────────────────────────────────────

  /subjects:
    get:
      summary: 科目一覧を取得
      tags: [ Subjects ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subjects/{name}/settings:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 科目設定を取得（最終目標など月によらない設定）
      tags: [ Subjects ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectSettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 科目設定を保存
      tags: [ Subjects ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectSettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /subjects/alert-status:
    get:
      summary: 全科目のアラート判定データを取得
      tags: [ Subjects ]
      description: |
        認証ユーザーの全科目について、アラート判定に必要なデータを一括返却する。
        各科目の `recentMinutes` は、その科目の `SubjectAlertSettings.minutesThresholdDays` を
        ウィンドウとして計算した学習時間（分）。
        アラート設定が未保存の科目はデフォルト設定（touchAlertEnabled=true, minutesAlertEnabled=false）を使用する。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertStatusItem'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subjects/{name}/alert-settings:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 科目別アラート設定を取得
      tags: [ Subjects ]
      description: 未設定の場合は touchAlertEnabled=true, minutesAlertEnabled=false のデフォルト値を返す。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectAlertSettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 科目別アラート設定を保存
      tags: [ Subjects ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubjectAlertSettings' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectAlertSettings' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /subjects/{name}/monthly-goal/{year}/{month}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
      - name: year
        in: path
        required: true
        schema: { type: integer }
      - name: month
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 12 }
    get:
      summary: 科目の月別方針を取得
      tags: [ Subjects ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectMonthlyGoal' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      summary: 科目の月別方針を保存
      tags: [ Subjects ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                goal: { type: string, nullable: true, maxLength: 1000 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubjectMonthlyGoal' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /subjects/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    put:
      summary: 科目名を変更
      description: |
        科目名を変更する。関連するすべてのデータ（学習記録・苦手問題・試験記録）のリレーションが保持される。
      tags: [ Subjects ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ newName ]
              properties:
                newName: { type: string, description: '新しい科目名' }
      responses:
        '200':
          description: 変更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: 科目を削除（カスケード）
      description: |
        科目を削除する。この科目に紐づく学習記録・苦手問題・試験記録もすべて削除される。
      tags: [ Subjects ]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /subjects/{subject}/activity:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 科目の日別アクティビティを取得
      tags: [ Subjects ]
      description: |
        指定月の全日付について、該当科目の学習時間と苦手問題追加数を返す。
        学習記録がない日は studyMinutes: 0、問題追加がない日は problemCount: 0 として返す。
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubjectActivityDay' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /subjects/{subject}/review-problems:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 今解くべき5問を取得
      tags: [ Subjects ]
      description: |
        以下の優先順位で苦手問題を最大5件返す。
        1. `lastTouchedAt`（最終演習日）が古い順。未演習（null）を最優先。
        2. `failureTypes` に `定義` を含むものを優先。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Flashcard' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /flashcards:
    get:
      summary: フラッシュカード一覧を取得
      tags: [ Subjects ]
      description: |
        苦手問題をフラッシュカード形式で返す。`subject` を指定した場合はその科目のみ、
        省略した場合は全科目を返す。選択アルゴリズムは戦略パターンで差し替え可能。
        現在はランダム抽出。
      parameters:
        - name: subject
          in: query
          required: false
          schema: { type: string }
          description: 科目名（省略時は全科目）
        - name: count
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 10 }
          description: 取得件数（省略時は10件）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Flashcard' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /subjects/{subject}/flashcards:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 科目別フラッシュカード一覧を取得
      tags: [ Subjects ]
      description: |
        指定科目の苦手問題をフラッシュカード形式で返す。
        - **表（front）**: 問題番号・小分類・教材・解答日
        - **裏（back）**: 復習ノート・習熟度・ミスタイプ・良問フラグ

        `solved_at` 降順・`created_at` 降順・`id` 降順でソート。
        カーソルページネーション（`after` に直前の末尾 ID を指定）に対応。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
          description: 取得件数（省略時は全件）
        - name: after
          in: query
          required: false
          schema: { type: integer }
          description: このIDより後のレコードを取得（カーソル）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Flashcard' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

