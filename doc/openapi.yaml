  # ── Gemini Context ───────────────────────────────────────────────────────────

  /gemini/context:
    get:
      summary: Geminiコピー用コンテキストデータを取得
      tags: [ AI ]
      description: |
        ダッシュボード統計・プロフィール・直近7日ログ・全科目詳細をまとめて返す。
        フロントエンドがGemini向けプロンプトを組み立てる際に使用する。

        **レスポンス構成:**
        - `profile` — occupation / goal / weakAreas / strongAreas（user_profiles）
        - `dashboard` — 総学習時間・当月時間・連続日数など
        - `recentDailyLogs` — 直近7日間の日別学習時間と振り返り（記録なし日は 0 補填）
        - `subjects[].studyMinutes` — 指定月の学習時間（分）
        - `subjects[].failureStats` — ミスの種類別の件数と割合
        - `subjects[].recentExamScore` — 直近の完了済み過去問スコア（未実施なら null）

        `year`/`month` を省略すると現在の年月が使用される。
      parameters:
        - name: year
          in: query
          required: false
          schema: { type: integer }
          description: '対象年（省略時: サーバー現在年）'
        - name: month
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12 }
          description: '対象月（省略時: サーバー現在月）'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GeminiContext' }
              example:
                year: 2026
                month: 5
                profile:
                  occupation: '会社員（製造業）'
                  goal: '中小企業診断士試験合格（2027年）'
                  weakAreas: '財務・会計の計算問題、法務の条文暗記'
                  strongAreas: '企業経営理論'
                dashboard:
                  currentStreak: 12
                  allTotalMinutes: 14400
                  thisMonthMinutes: 960
                  subjectMinutes:
                    - { subject: '財務・会計', minutes: 480 }
                    - { subject: '企業経営理論', minutes: 480 }
                recentDailyLogs:
                  - { date: '2026-05-05', studyMinutes: 120, reflection: '財務の連結会計を復習' }
                  - { date: '2026-05-06', studyMinutes: 0,   reflection: null }
                  - { date: '2026-05-07', studyMinutes: 90,  reflection: '過去問2023年を解いた' }
                subjects:
                  - subject: '財務・会計'
                    finalTarget: '70点以上で科目合格'
                    monthlyGoal: '手薄な連結会計を重点的に'
                    studyMinutes: 480
                    problemCount: 23
                    failureStats:
                      - { type: '定義', count: 10, ratio: 0.50 }
                      - { type: '解法', count: 7,  ratio: 0.35 }
                      - { type: 'ケアレス', count: 3,  ratio: 0.15 }
                    recentExamScore:
                      examYear: 2023
                      score: 68
                      completedAt: '2026-04-15'
        '401':
          $ref: '#/components/responses/Unauthorized'

