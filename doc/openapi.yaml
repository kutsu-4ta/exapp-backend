        '204':
          description: 削除成功
        '401':
          description: 未認証

  /dashboard/stats:
    get:
      summary: ダッシュボード集計データを取得
      tags: [Dashboard]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardStats' }
        '401':
          description: 未認証

  # ── Exam Sessions ───────────────────────────────────────────────────────────

  /exam-sessions:
    get:
      summary: 試験セッション一覧を取得
      tags: [Exam]
      parameters:
        - name: status
          in: query
          required: false
          schema: { $ref: '#/components/schemas/ExamSessionStatus' }
          description: ステータスでフィルタ（省略時は全件）
        - name: subject
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Subject' }
          description: 科目でフィルタ
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ExamSessionSummary' }
        '401':
          description: 未認証
    post:
      summary: 試験セッションを作成
      tags: [Exam]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, examYear]
              properties:
                subject: { $ref: '#/components/schemas/Subject' }
                examYear: { type: string, example: 'R07' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証

  /exam-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 試験セッション詳細を取得
      tags: [Exam]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
    put:
      summary: 試験セッションのメタデータを更新
      tags: [Exam]
      description: subject・examYear の編集に使用。status の直接変更も可能（scoring への変更など）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { $ref: '#/components/schemas/Subject' }
                examYear: { type: string }
                status: { $ref: '#/components/schemas/ExamSessionStatus' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
    delete:
      summary: 試験セッションを削除
      tags: [Exam]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
        '404':
          description: 見つからない

  /exam-sessions/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: 試験を完了として保存
      tags: [Exam]
      description: |
        解答・採点データを一括登録し、ステータスを completed に変更する。
        既存の questions は全て置き換えられる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, examYear, questions]
              properties:
                subject: { $ref: '#/components/schemas/Subject' }
                examYear: { type: string }
                questions:
                  type: array
                  items: { $ref: '#/components/schemas/ExamQuestionInput' }
      responses:
        '200':
          description: 保存・完了成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Exam Subject Stats ───────────────────────────────────────────────────────

  /exam-subjects/{subject}/stats:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { $ref: '#/components/schemas/Subject' }
        description: URLエンコードされた科目名
    get:
      summary: 科目別の分析データを取得
      tags: [Exam]
      description: |
        指定科目のランク別正答率と直近のミスメモ（note があるもの）を返す。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSubjectStats' }
        '401':
          description: 未認証

  /auth/google:
    post:
      summary: Googleログイン（Firebase ID Token検証）
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token: { type: string, description: 'Firebase ID Token' }
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                required: [token, user]
                properties:
                  token: { type: string, description: 'アクセストークン（Bearer）' }
                  user:
                    type: object
                    required: [id, name, email]
                    properties:
                      id: { type: integer }
                      name: { type: string }
                      email: { type: string, format: email }
        '401':
          description: IDトークンが無効
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/refresh:
    post:
      summary: トークンリフレッシュ
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token: { type: string, description: 'Firebase リフレッシュトークン' }
      responses:
        '200':
          description: リフレッシュ成功
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token: { type: string, description: '新しいアクセストークン（Bearer）' }
        '401':
          description: リフレッシュトークンが無効
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/me:
    get:
      summary: 認証済みユーザー情報取得
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: ユーザー情報
          content:
            application/json:
              schema:
                type: object
                required: [id, name, email]
                properties:
                  id: { type: integer }
                  name: { type: string }
                  email: { type: string, format: email }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── Profile ──────────────────────────────────────────────────────────────────

  /profile:
    get:
      summary: プロフィール取得
      tags: [Profile]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: 未認証
    put:
      summary: プロフィール更新（upsert）
      tags: [Profile]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserProfileInput' }
            example:
              nickname: やっぴー
              occupation: ITエンジニア（SE）
              goal: 中小企業診断士試験に一発合格（週45時間学習）
              weakAreas: 経営法務、中小企業経営・政策
              strongAreas: 財務・会計、経営情報システム
              interests: 物理学、歴史、哲学、言語学
              geminiToken: AIzaSy...
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserProfile' }
        '401':
          description: 未認証
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ── AI Advice ────────────────────────────────────────────────────────────────

  /ai/advice:
    post:
      summary: AIアドバイスを生成
      tags: [AI]
      description: |
        ユーザーの学習ログ・苦手問題・目標データをもとに Gemini API を呼び出し、
        モード別のアドバイスを生成して返す。

        | モード | 内容 |
        |---|---|
        | `ANALYSIS` | 今週の達成率・残り時間を算出し、時間ブロック配置案を提案 |
        | `INSPIRATION` | 連続学習日数などを哲学・歴史の引用とともに称えモチベを向上 |
        | `ANALOGY` | 直近の学習科目の概念をIT/物理学に1対1マッピングして解説 |
        | `INSIGHT` | 試験知識とSE実務・最新技術・言語学の予想外の接続を提示 |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: '#/components/schemas/AiAdviceMode'
            examples:
              analysis:
                summary: ANALYSISモード
                value: { mode: ANALYSIS }
              inspiration:
                summary: INSPIRATIONモード
                value: { mode: INSPIRATION }
      responses:
        '200':
          description: アドバイス生成成功
          content:
            application/json:
              schema:
                type: object
                required: [advice]
                properties:
                  advice:
                    type: string
                    description: 生成されたアドバイス（100〜250文字程度）
                    example: '今週は財務・会計に集中しているが、法務が0分。残り12時間のうち3時間を法務に充て、過去問2年分を解くことで弱点を一気に潰せる。'
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: modeが不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Gemini API 呼び出し失敗
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      summary: ログアウト
      tags: [Auth]
      description: |
        現在使用中のアクセストークンを削除し、セッションを終了します。
        内部的には Laravel Sanctum の `currentAccessToken()->delete()` を実行します。
      security:
        - bearerAuth: [] # この操作には有効なトークンが必須
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログアウトしました。
        '401':
          description: 未認証、またはトークンが無効
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
