  /exam-sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    get:
      summary: 試験セッション詳細を取得
      tags: [Exam]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
    put:
      summary: 試験セッションのメタデータを更新
      tags: [Exam]
      description: subject・examYear の編集に使用。status の直接変更も可能（scoring への変更など）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject: { $ref: '#/components/schemas/Subject' }
                examYear: { type: string }
                status: { $ref: '#/components/schemas/ExamSessionStatus' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
    delete:
      summary: 試験セッションを削除
      tags: [Exam]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
        '404':
          description: 見つからない

  /exam-sessions/{id}/complete:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    post:
      summary: 試験を完了として保存
      tags: [Exam]
      description: |
        解答・採点データを一括登録し、ステータスを completed に変更する。
        既存の questions は全て置き換えられる。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject, examYear, questions]
              properties:
                subject: { $ref: '#/components/schemas/Subject' }
                examYear: { type: string }
                questions:
                  type: array
                  items: { $ref: '#/components/schemas/ExamQuestionInput' }
      responses:
        '200':
          description: 保存・完了成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamSession' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /exam-sessions/{id}/questions/{sortOrder}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: 試験セッション ID
      - name: sortOrder
        in: path
        required: true
        schema: { type: integer, minimum: 0 }
        description: 問題の表示順（0始まり）
    patch:
      summary: 問題の回答タイムスタンプを更新（中間記録）
      tags: [Exam]
      description: |
        問題の表示開始（`event: "start"`）または回答確定（`event: "finish"`）を記録する。

        **タイムスタンプはサーバー基準で記録する。** フロントが時刻を送る必要はない。

        | event | 動作 |
        |---|---|
        | `start` | `answered_started_at = now()` をセット（初回のみ。既に記録済みなら無視）|
        | `finish` | `answered_finished_at = now()` をセットし、`answered_time_ms` をサーバー計算 |

        問題レコードがまだ存在しない場合は、提供されたメタデータで新規作成する。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event]
              properties:
                event:
                  type: string
                  enum: [start, finish]
                  description: '`start` = 問題表示、`finish` = 回答確定'
                displayId:
                  type: string
                  description: 問題の表示 ID（初回のみ使用）
                isSub:       { type: boolean }
                hasChildren: { type: boolean }
                rank:        { $ref: '#/components/schemas/Rank' }
                isDoubtful:  { type: boolean }
                point:       { type: integer, minimum: 0 }
            examples:
              start:
                summary: 問題表示時
                value: { event: start, displayId: "第1問", isSub: false, hasChildren: false, rank: A, isDoubtful: false, point: 5 }
              finish:
                summary: 回答確定時
                value: { event: finish }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExamQuestion' }
        '401':
          description: 未認証
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: 試験セッションが見つからない
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

