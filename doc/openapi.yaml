openapi: 3.0.3
info:
  title: Exapp API
  description: 中小企業診断士 学習管理アプリ API仕様書
  version: 0.2.0

servers:
  - url: /api
    description: Next.js proxy (→ backend)

# ルートレベルで認証を有効化（全体適用）
security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    UserProfile:
      type: object
      properties:
        nickname:       { type: string, nullable: true }
        occupation:     { type: string, nullable: true }
        goal:           { type: string, nullable: true }
        weakAreas:      { type: string, nullable: true }
        strongAreas:    { type: string, nullable: true }
        interests:      { type: string, nullable: true }
        geminiTokenSet: { type: boolean, description: '個別Geminiトークンが登録済みかどうか（トークン本体は返さない）' }

    UserProfileInput:
      type: object
      properties:
        nickname:     { type: string, nullable: true, maxLength: 50 }
        occupation:   { type: string, nullable: true, maxLength: 100 }
        goal:         { type: string, nullable: true, maxLength: 500 }
        weakAreas:    { type: string, nullable: true, maxLength: 500, description: '苦手科目（カンマ区切り等、自由記述）' }
        strongAreas:  { type: string, nullable: true, maxLength: 500, description: '得意科目（カンマ区切り等、自由記述）' }
        interests:    { type: string, nullable: true, maxLength: 500, description: '趣味・嗜好' }
        geminiToken:  { type: string, nullable: true, maxLength: 200, description: 'ユーザー個別のGemini APIキー（保存時に暗号化）' }

    AiAdviceMode:
      type: string
      enum: [ANALYSIS, INSPIRATION, ANALOGY, INSIGHT]
      description: |
        AIアドバイスのモード。
        - ANALYSIS: 目標達成率と時間ブロック配置を論理的に分析
        - INSPIRATION: 哲学・歴史の引用で学習努力を称える
        - ANALOGY: 試験概念をIT/物理学に例えて解説
        - INSIGHT: 試験知識と実務・最新技術を結ぶ洞察

    TimeSlot:
      type: string
      enum: [morning, lunch, commute, night]
    Subject:
      type: string
      description: ユーザーが定義した科目名
    Material:
      type: string
      description: ユーザーが定義した教材名

    AlertSettings:
      type: object
      required: [thresholdDays, includeUntouched]
      properties:
        thresholdDays:
          type: integer
          minimum: 1
          description: '何日間学習がなければ警告するか'
        includeUntouched:
          type: boolean
          description: '一度も学習していない科目も警告対象に含めるか'

    SubCategory:
      type: object
      required: [id, subject, name, createdAt, updatedAt]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SubCategoryInput:
      type: object
      required: [subject, name]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string }

    MonthlySettings:
      type: object
      required: [year, month, targetMin, targetMax]
      properties:
        year: { type: integer }
        month: { type: integer, minimum: 1, maximum: 12 }
        targetMin: { type: number, description: '月間目標下限（時間）' }
        targetMax: { type: number, description: '月間目標上限（時間）' }

    MonthlySettingsInput:
      type: object
      required: [targetMin, targetMax]
      properties:
        targetMin: { type: number, description: '月間目標下限（時間）' }
        targetMax: { type: number, description: '月間目標上限（時間）' }

    StudySession:
      type: object
      required: [id, dailyLogDate, timeSlot, minutes, subject, material]
      properties:
        id: { type: integer }
        dailyLogDate: { type: string, format: date }
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        memo: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    StudySessionInput:
      type: object
      required: [timeSlot, minutes, subject, material]
      properties:
        timeSlot: { $ref: '#/components/schemas/TimeSlot' }
        minutes: { type: integer, minimum: 1 }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        memo: { type: string, nullable: true }

    DailyLog:
      type: object
      required: [date, isCompleted, studySessions]
      properties:
        date: { type: string, format: date }
        reflection: { type: string, nullable: true }
        isCompleted: { type: boolean }
        completedAt: { type: string, format: date-time, nullable: true }
        studySessions:
          type: array
          items: { $ref: '#/components/schemas/StudySession' }
        totalMinutes: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DailyLogSummary:
      type: object
      required: [date, isCompleted, totalMinutes]
      properties:
        date: { type: string, format: date }
        isCompleted: { type: boolean }
        totalMinutes: { type: integer }
        sessionCount: { type: integer }

    Proficiency:
      type: string
      enum: ['○', '△', '×']

    FailureType:
      type: string
      enum: ['定義ミス', '解法ミス', '計算ミス']

    Problem:
      type: object
      required: [id, subject, material, questionRef, proficiency, failureTypes, isGoodQuestion, solvedAt, createdAt, updatedAt]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        solvedAt: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ProblemInput:
      type: object
      required: [subject, material, questionRef, proficiency, failureTypes, isGoodQuestion, solvedAt]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        material: { $ref: '#/components/schemas/Material' }
        subCategory: { type: string, nullable: true, description: '小分類名（未登録なら自動登録）' }
        questionRef: { type: string }
        note: { type: string, nullable: true }
        proficiency: { $ref: '#/components/schemas/Proficiency' }
        failureTypes: { type: array, items: { $ref: '#/components/schemas/FailureType' } }
        isGoodQuestion: { type: boolean }
        solvedAt: { type: string, format: date }

    DashboardStats:
      type: object
      required: [thisMonthMinutes, thisMonthDays, last7DaysMinutes, weeklyAvgMinutes, subjectMinutes, lastTouchedBySubject, dailyMinutes]
      properties:
        thisMonthMinutes: { type: integer }
        thisMonthDays: { type: integer }
        last7DaysMinutes: { type: integer }
        weeklyAvgMinutes: { type: number, format: float }
        subjectMinutes:
          type: array
          items:
            type: object
            required: [subject, minutes]
            properties:
              subject: { type: string }
              minutes: { type: integer }
        lastTouchedBySubject:
          type: array
          items:
            type: object
            required: [subject, lastDate]
            properties:
              subject: { type: string }
              lastDate: { type: string, format: date, nullable: true }
        dailyMinutes:
          type: array
          items:
            type: object
            required: [date, minutes]
            properties:
              date: { type: string, format: date }
              minutes: { type: integer }

    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # ── Exam ────────────────────────────────────────────────────────────────────

    Rank:
      type: string
      enum: [A, B, C, D, E]
      description: 問題の重要度ランク（A=最重要〜E=低優先）

    ExamSessionStatus:
      type: string
      enum: [in_progress, scoring, completed]
      description: 'in_progress: 解答中, scoring: 自己採点中, completed: 完了'

    ExamQuestion:
      type: object
      required: [id, examSessionId, sortOrder, displayId, isSub, hasChildren, rank, isDoubtful, point]
      properties:
        id: { type: integer }
        examSessionId: { type: integer }
        sortOrder: { type: integer, description: '表示順（0始まり）' }
        displayId: { type: string, description: '第1問・設問1 など表示用ID' }
        isSub: { type: boolean, description: '設問（小問）かどうか' }
        hasChildren: { type: boolean, description: '小問を持つ親問かどうか' }
        rank: { $ref: '#/components/schemas/Rank' }
        myAnswer: { type: string, nullable: true, description: 'ア〜オ または記述解答（未回答時はnull）' }
        answeredTimeMs: { type: integer, nullable: true, description: '解答にかかった時間（ミリ秒）' }
        isCorrect: { type: boolean, nullable: true, description: '正誤（null=未採点）' }
        isDoubtful: { type: boolean, description: '要復習フラグ' }
        point: { type: integer, description: '配点' }
        note: { type: string, nullable: true, description: 'ミスメモ' }

    ExamQuestionInput:
      type: object
      required: [sortOrder, displayId, isSub, hasChildren, rank, isDoubtful, point]
      properties:
        sortOrder: { type: integer }
        displayId: { type: string }
        isSub: { type: boolean }
        hasChildren: { type: boolean }
        rank: { $ref: '#/components/schemas/Rank' }
        myAnswer: { type: string, nullable: true }
        isCorrect: { type: boolean, nullable: true }
        isDoubtful: { type: boolean }
        point: { type: integer }
        note: { type: string, nullable: true }
        answeredTimeMs: { type: integer, nullable: true, description: '解答時のストップウォッチ経過時間（ms）' }

    ExamSession:
      type: object
      required: [id, subject, examYear, status, questions, totalScore, pureScore, correctCount, incorrectCount, doubtfulCount, createdAt]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        examYear: { type: string, example: 'R07', description: '受験年度（R07 等）' }
        status: { $ref: '#/components/schemas/ExamSessionStatus' }
        questions:
          type: array
          items: { $ref: '#/components/schemas/ExamQuestion' }
        totalScore: { type: integer, readOnly: true, description: '採点後の合計得点' }
        pureScore: { type: integer, readOnly: true, description: '要復習を除いた純粋な得点' }
        correctCount: { type: integer, readOnly: true }
        incorrectCount: { type: integer, readOnly: true }
        doubtfulCount: { type: integer, readOnly: true }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ExamSessionSummary:
      type: object
      required: [id, subject, examYear, totalScore, pureScore, createdAt]
      properties:
        id: { type: integer }
        subject: { $ref: '#/components/schemas/Subject' }
        examYear: { type: string }
        totalScore: { type: integer }
        pureScore: { type: integer }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }

    ExamMistakeNote:
      type: object
      required: [questionId, sessionId, examYear, displayId, rank, note, isDoubtful, completedAt]
      properties:
        questionId: { type: integer }
        sessionId: { type: integer }
        examYear: { type: string }
        displayId: { type: string }
        rank: { $ref: '#/components/schemas/Rank' }
        note: { type: string }
        isDoubtful: { type: boolean }
        completedAt: { type: string, format: date-time }

    ExamRankStat:
      type: object
      required: [rank, correctRate, count]
      properties:
        rank: { $ref: '#/components/schemas/Rank' }
        correctRate: { type: number, format: float, minimum: 0, maximum: 1 }
        count: { type: integer, description: '該当ランクの問題数' }

    ExamSubjectStats:
      type: object
      required: [subject, sessionCount, avgTotalScore, avgPureScore, rankStats, recentMistakes]
      properties:
        subject: { $ref: '#/components/schemas/Subject' }
        sessionCount: { type: integer }
        avgTotalScore: { type: number, format: float }
        avgPureScore: { type: number, format: float }
        rankStats:
          type: array
          items: { $ref: '#/components/schemas/ExamRankStat' }
        recentMistakes:
          type: array
          items: { $ref: '#/components/schemas/ExamMistakeNote' }
          description: '直近10件のミスメモ（note が入力されているもの）'

paths:
  # ── Subjects ─────────────────────────────────────────────────────────────────

  /subjects:
    get:
      summary: 科目一覧を取得
      tags: [Subjects]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401':
          description: 未認証

  /subjects/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    put:
      summary: 科目名を変更
      description: |
        科目名を変更する。関連するすべてのデータ（学習記録・苦手問題・試験記録）のリレーションが保持される。
      tags: [Subjects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newName]
              properties:
                newName: { type: string, description: '新しい科目名' }
      responses:
        '200':
          description: 変更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
        '401':
          description: 未認証
        '404':
          description: 科目が見つからない
        '409':
          description: 同名の科目が既に存在する
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: 科目を削除（カスケード）
      description: |
        科目を削除する。この科目に紐づく学習記録・苦手問題・試験記録もすべて削除される。
      tags: [Subjects]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
        '404':
          description: 科目が見つからない

  # ── Materials ────────────────────────────────────────────────────────────────

  /materials:
    get:
      summary: 教材一覧を取得
      tags: [Materials]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        '401':
          description: 未認証

  /materials/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた教材名
    put:
      summary: 教材名を変更
      tags: [Materials]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [newName]
              properties:
                newName: { type: string, description: '新しい教材名' }
      responses:
        '200':
          description: 変更成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
        '401':
          description: 未認証
        '404':
          description: 教材が見つからない
        '409':
          description: 同名の教材が既に存在する
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      summary: 教材を削除
      description: |
        教材を削除する。この教材が紐づく学習記録・苦手問題の material フィールドは空文字列に更新される。
      tags: [Materials]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
        '404':
          description: 教材が見つからない

  # ── Alert Settings ──────────────────────────────────────────────────────────

  /alert-settings:
    get:
      summary: アラート設定を取得
      tags: [Alert Settings]
      description: ユーザーのアラート通知設定を返す。未設定の場合はデフォルト値を返す。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '401':
          description: 未認証
    put:
      summary: アラート設定を保存
      tags: [Alert Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AlertSettings' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertSettings' }
        '401':
          description: 未認証

  # ── Sub Categories ──────────────────────────────────────────────────────────

  /sub-categories:
    get:
      summary: 小分類一覧を取得
      tags: [Sub Categories]
      parameters:
        - name: subject
          in: query
          required: false
          schema: { $ref: '#/components/schemas/Subject' }
          description: 科目でフィルタ（省略時は全件）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SubCategory' }
        '401':
          description: 未認証
    post:
      summary: 小分類を追加
      tags: [Sub Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubCategoryInput' }
      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubCategory' }
        '401':
          description: 未認証

  /sub-categories/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: 小分類を更新
      tags: [Sub Categories]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubCategoryInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SubCategory' }
        '401':
          description: 未認証
        '404':
          description: 見つからない
    delete:
      summary: 小分類を削除
      tags: [Sub Categories]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証

  # ── Monthly Settings ────────────────────────────────────────────────────────

  /monthly-settings/{year}/{month}:
    parameters:
      - name: year
        in: path
        required: true
        schema: { type: integer }
      - name: month
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 12 }
    get:
      summary: 月間設定を取得
      tags: [Monthly Settings]
      description: 指定した年月の目標設定を返す。未設定の場合はデフォルト値を返す。
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlySettings' }
        '401':
          description: 未認証
    put:
      summary: 月間設定を保存
      tags: [Monthly Settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MonthlySettingsInput' }
      responses:
        '200':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlySettings' }
        '401':
          description: 未認証

  # ── Daily Logs ──────────────────────────────────────────────────────────────

  /daily-logs:
    get:
      summary: 月間ログ一覧を取得
      tags: [Daily Logs]
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer }
        - name: month
          in: query
          required: true
          schema: { type: integer, minimum: 1, maximum: 12 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyLogSummary' }
        '401':
          description: 未認証
    post:
      summary: デイリーログを作成
      tags: [Daily Logs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date]
              properties:
                date: { type: string, format: date }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401':
          description: 未認証

  /daily-logs/recent:
    get:
      summary: 直近のログ一覧を取得（カーソルベースページネーション）
      tags: [Daily Logs]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 30 }
          description: 取得件数
        - name: before
          in: query
          required: false
          schema: { type: string, format: date }
          description: このdateより前のログを取得（カーソル）
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DailyLogSummary' }
        '401':
          description: 未認証

  /daily-logs/{date}:
    parameters:
      - name: date
        in: path
        required: true
        schema: { type: string, format: date }
    delete:
      summary: デイリーログを削除
      description: 指定日のデイリーログとそれに紐づく学習セッションをすべて削除する。
      tags: [Daily Logs]
      responses:
        '204':
          description: 削除成功
        '401':
          description: 未認証
        '404':
          description: 見つからない
    get:
      summary: 特定日のログを取得
      tags: [Daily Logs]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyLog' }
        '401':
          description: 未認証
        '404':
          description: 未作成
    put:
      summary: 振り返りテキストを更新
      tags: [Daily Logs]
