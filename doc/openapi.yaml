      responses:
        '201':
          description: 追加成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 未認証

  /problems/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: 苦手問題を更新
      tags: [Problems]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProblemInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: 未認証
    delete:
      summary: 苦手問題を削除
      tags: [Problems]
