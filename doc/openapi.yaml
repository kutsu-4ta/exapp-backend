  # ── Morning Bugfix ───────────────────────────────────────────────────────────

  /deg-bugfix:
    get:
      summary: DegBugfix セッションを取得
      tags: [ AI ]
      description: |
        ユーザーが「良問」登録した `ProblemQuiz` を元にクイズセッションを組み立てて返す。
        科目を指定した場合はその科目の良問のみを対象にする。省略時は全科目が対象。
        登録済み良問がない、または指定条件に合致する良問がない場合は 422 を返す。
      parameters:
        - name: subject
          in: query
          required: false
          schema: { type: string }
          description: '科目名フィルタ。省略時は全科目対象'
          example: '企業経営理論'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 20 }
          description: '取得問題数。良問の総数が limit 未満の場合は全件返す'
          example: 5
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MorningBugfixSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: 条件に合致する良問クイズが存在しない
          content:
            application/json:
              schema:
                type: object
                required: [ message ]
                properties:
                  message: { type: string, example: '良問クイズが登録されていません' }

  /morning-bugfix:
    get:
      summary: 定義復習クイズセッションを取得（Morning Bugfix / Flash Bugfix）
      tags: [ AI ]
      description: |
        苦手問題から定義理解クイズを生成して返す汎用エンドポイント。
        新パラメータ（`failureType`, `subCategoryIds`, `touchedOrder`, `proficiency`, `limit`）を
        **1つも指定しない**場合は Morning Bugfix モードとして動作し、既存の挙動を維持する。
        いずれか1つでも指定した場合は Flash Bugfix モード（柔軟フィルタ）として動作する。

        ### Morning Bugfix モード（パラメータ未指定）
        デフォルト: `failureType=['定義']`, `limit=5`

        **3段階フォールバック:**
        1. `last_touched_at == 昨日` かつ `定義`（RANDOM）
        2. 直近7日以内の定義（昨日を除く）で補填（RANDOM）
        3. 全期間の定義を習熟度低い順（×→△→○）で補填

        `date` パラメータを指定するとその日を「今日」とみなす（テスト用）。

        ### Flash Bugfix モード（任意パラメータ指定）
        指定した条件で問題を抽出し、不足時は段階的に条件を緩めて補填する。
        複数選択されたパラメータ（`failureType`, `subCategoryIds`, `proficiency`）は、
        それぞれの配列内での **OR条件** としてフィルタリングされる。

        **フォールバック順:**
        1. `failureType` + `subCategoryIds`（フル条件）
        2. `failureType` のみ（`subCategoryIds` を緩める）
        3. `subCategoryIds` のみ（`failureType` を緩める）
        4. 全問題（習熟度低い順）
      parameters:
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: '基準日（Morning Bugfix モード専用・省略時: サーバー今日）'
        - name: failureType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/FailureType' }
          description: 'ミス種別フィルタ（複数選択可）。未指定なら全ミス種別対象（Morning Bugfix デフォルト: [定義]）'
          example: [ '定義', '解法' ]
        - name: subCategoryIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
          description: '小分類IDフィルタ（複数選択可）。未指定なら全小分類対象'
          example: [ 12, 15 ]
        - name: touchedOrder
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TouchedOrder' }
          description: '最後に触れた日からの近さ。未指定なら RANDOM'
          example: 'old'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 10 }
          description: '取得問題数（max: 10）'
          example: 10
        - name: proficiency
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Proficiency' }
          description: '習熟度フィルタ（複数選択可）。未指定なら △/× のみ'
          example: [ '△', '×' ]
        - name: subject
          in: query
          required: false
          schema: { type: string }
          description: '科目名フィルタ（Flash Bugfix 専用）。指定するとその科目の問題のみを対象にする'
          example: '企業経営理論'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MorningBugfixSession' }
              examples:
                morning_bugfix:
                  summary: Morning Bugfix（パラメータ未指定）
                  value:
                    session_id: 'morning_bugfix_20260512'
                    meta: { total_questions: 3, strategy: 'definition_focused' }
                    questions:
                      - id: 42
                        subject: '企業経営理論'
                        sub_category: '経営戦略論'
                        problem_context: { original_ref: '2023年 第12問', user_memo: 'PPM の定義' }
                        quiz:
                          question: '次のうちPPMにおける「花形」の定義として正しいものはどれか？'
                          options: [ '高シェア・高成長', '低シェア・高成長', '高シェア・低成長', '低シェア・低成長' ]
                          correct_index: 0
                          explanation: '花形は市場成長率・市場シェアともに高い事業...'
                        last_touched_at: '2026-05-11'
                flash_bugfix:
                  summary: Flash Bugfix（subjectPage から）
                  value:
                    session_id: 'flash_bugfix_20260512'
                    meta: { total_questions: 5, strategy: 'flash_bugfix' }
                    questions: [ ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  # ── Flash Card ───────────────────────────────────────────────────────────────

  /flash-card:
    get:
      summary: 単語カードセッションを取得（Flash Bugfix 単語カードモード）
      tags: [ AI ]
      description: |
        苦手問題から単語カード形式のセッションを生成して返す。
        レスポンス構造は `/morning-bugfix` と同じ `MorningBugfixSession` を使用する。
        フロントエンドでは `quiz.question` を表面、`quiz.explanation` を裏面として表示する。

        ### 公式チェックモード（`formulaOnly=true`）
        財務会計・経済学・運営管理などで重宝する公式・定義のみに絞った問題を返す。
        バックエンドは `is_formula=true` フラグを持つ問題のみを対象にフィルタリングする。

        ### フォールバック順（Flash Bugfix と同様）
        1. `failureType` + `subCategoryIds`（フル条件）
        2. `failureType` のみ
        3. `subCategoryIds` のみ
        4. 全問題（習熟度低い順）
      parameters:
        - name: subject
          in: query
          required: true
          schema: { type: string }
          description: 科目名
          example: '財務・会計'
        - name: failureType
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/FailureType' }
          description: 'ミス種別フィルタ（複数選択可）。未指定なら全ミス種別対象'
          example: [ '定義', '解法' ]
        - name: subCategoryIds
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { type: integer }
          description: '小分類IDフィルタ（複数選択可）。未指定なら全小分類対象'
          example: [ 12, 15 ]
        - name: touchedOrder
          in: query
          required: false
          schema: { $ref: '#/components/schemas/TouchedOrder' }
          description: '最後に触れた日からの近さ。未指定なら RANDOM'
          example: 'old'
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 5, minimum: 1, maximum: 10 }
          description: '取得問題数（max: 10）'
          example: 5
        - name: proficiency
          in: query
          required: false
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: '#/components/schemas/Proficiency' }
          description: '習熟度フィルタ（複数選択可）。未指定なら △/× のみ'
          example: [ '△', '×' ]
        - name: formulaOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: |
            `true` にすると公式・定義フラグ（`is_formula=true`）が付いた問題のみを対象にする。
            財務会計・経済学・運営管理の公式チェックモードで使用する。
          example: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MorningBugfixSession' }
              examples:
                word_card:
                  summary: 単語カードモード（formulaOnly=false）
                  value:
                    session_id: 'flash_card_20260516'
                    meta: { total_questions: 5, strategy: 'word_card' }
                    questions:
                      - id: 101
                        subject: '財務・会計'
                        sub_category: 'CVP分析'
                        problem_context: { original_ref: 'R04 第8問', user_memo: '' }
                        quiz:
                          question: '損益分岐点売上高の計算式を答えよ。'
                          options: [ ]
                          correct_index: 0
                          explanation: '固定費 ÷ 限界利益率。限界利益率 = (売上高 - 変動費) / 売上高'
                        last_touched_at: '2026-05-10'
                formula_check:
                  summary: 公式チェックモード（formulaOnly=true）
                  value:
                    session_id: 'flash_card_formula_20260516'
                    meta: { total_questions: 5, strategy: 'formula_check' }
                    questions: [ ]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── AI Advice ────────────────────────────────────────────────────────────────

  /ai/advice:
    post:
      summary: AIアドバイスを生成
      tags: [ AI ]
      description: |
        ユーザーの学習ログ・苦手問題・目標データをもとに Gemini API を呼び出し、
        モード別のアドバイスを生成して返す。

        | モード | 内容 |
        |---|---|
        | `ANALYSIS` | 今週の達成率・残り時間を算出し、時間ブロック配置案を提案 |
        | `INSPIRATION` | 客観的な事実で学習努力を称える |
        | `ANALOGY` | 試験概念を趣味に例えて解説 |
        | `WARNING` | 危機感を煽る冷徹な鬼コーチ |
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ mode ]
              properties:
                mode:
                  $ref: '#/components/schemas/AiAdviceMode'
            examples:
              analysis:
                summary: ANALYSISモード
                value: { mode: ANALYSIS }
              inspiration:
                summary: INSPIRATIONモード
                value: { mode: INSPIRATION }
      responses:
        '200':
          description: アドバイス生成成功
          content:
            application/json:
              schema:
                type: object
                required: [ advice ]
                properties:
                  advice:
                    type: string
                    description: 生成されたアドバイス（100〜250文字程度）
                    example: '今週は財務・会計に集中しているが、法務が0分。残り12時間のうち3時間を法務に充て、過去問2年分を解くことで弱点を一気に潰せる。'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: modeが不正
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'The given data was invalid.', errors: { mode: [ 'modeは ANALYSIS, INSPIRATION, ANALOGY, WARNING のいずれかを指定してください。' ] } }
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  /ai/analysis:
    post:
      summary: 問題画像を解析して苦手問題に登録
      tags: [ AI ]
      description: |
        アップロードされた試験問題の画像を Gemini 1.5 Flash でマルチモーダル解析し、
        苦手問題 (Problem)のメタ情報を補足要素として解説画像を読み取り、noteに保存する。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [ image, problemId ]
              properties:
                image:
                  type: string
                  format: binary
                  description: 問題画像（JPEG / PNG / WebP / HEIC、最大 10MB）
                memo:
                  type: string
                  nullable: true
                  maxLength: 2000
                  description: 解答時のユーザーメモ。指定するとGeminiのノート生成に間違えた原因・改善ポイントが追加される。
      responses:
        '201':
          description: 解析成功・苦手問題として保存
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: バリデーションエラー（ファイル形式・サイズ不正など）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'The given data was invalid.', errors: { image: [ '画像ファイルは必須です。' ] } }
        '429':
          $ref: '#/components/responses/GeminiQuotaExceeded'
        '500':
          description: Gemini が期待する JSON を返さなかった場合など
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: 'Gemini returned invalid JSON' }
        '503':
          $ref: '#/components/responses/GeminiUnavailable'

  # ── Practice sessions ────────────────────────────────────────────────────────

  /practice/sessions/draft:
    put:
      summary: 演習ドラフトを保存（途中再開用）
      tags: [ Practice ]
      description: |
        演習途中の状態を保存する。同一科目のドラフトが存在する場合は上書きする。
        フロントエンドは回答のたびに呼び出すことで、アプリ終了後の再開を可能にする。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
      responses:
        '204':
          description: 保存成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /practice/sessions/draft/{subject}:
    parameters:
      - name: subject
        in: path
        required: true
        schema: { type: string }
        description: URLエンコードされた科目名
    get:
      summary: 演習ドラフトを取得
      tags: [ Practice ]
      responses:
        '200':
          description: ドラフトが存在する
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionDraft' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: ドラフトなし（演習未開始または完了・削除済み）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { message: '指定された科目のドラフトが見つかりません。' }
    delete:
      summary: 演習ドラフトを削除（完了・破棄時）
      tags: [ Practice ]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'

  /practice/sessions:
    post:
      summary: 演習セッションを保存する
      tags: [ Practice ]
      description: |
        一問一答演習の結果を保存する。
        バックエンドは受け取った totalElapsedMs を分単位（切り上げ）に変換し、
        該当日の DailyLog に StudySession を自動生成することを推奨する。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PracticeSessionInput' }
      responses:
        '201':
          description: 保存成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PracticeSessionResult' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── Sprint ────────────────────────────────────────────────────────────────────

  /sprints:
    get:
      summary: スプリント一覧を取得する
      tags: [ Sprint ]
      description: |
        ユーザーの全スプリントを返す。
        バックログスプリントが未作成の場合は自動生成される。
        レスポンスはバックログを先頭に、以降は作成日降順で返す。
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Sprint' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: スプリントを作成する
      tags: [ Sprint ]
      description: type は常に `active`。バックログはシステムが自動生成するため手動作成不可。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintInput' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sprints/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: スプリント詳細を取得する
      tags: [ Sprint ]
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: スプリントを更新する
      tags: [ Sprint ]
      description: |
        バックログスプリントは `name` のみ変更可能。
        `startDate` / `endDate` はバックログに対して送信しても無視される。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SprintUpdateInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      summary: スプリントを削除する
      tags: [ Sprint ]
      description: バックログスプリントは削除不可（422 を返す）。
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sprints/{id}/complete:
    post:
      summary: スプリントを完了する
      tags: [ Sprint ]
      description: |
        `status` を `completed` に変更し `completedAt` をセットする。
        バックログおよびすでに完了済みのスプリントには 422 を返す。
        振り返り（`retrospective`）は必須。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ retrospective ]
              properties:
                retrospective: { type: string, description: '振り返り（Markdown）' }
      responses:
        '200':
          description: 完了成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sprint' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /sprints/{id}/stats:
    get:
      summary: スプリントのKPIを取得する
      tags: [ Sprint ]
      description: |
        チケット消化率・平均完了日数・小分類別集計を返す。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SprintStats' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ── StudyTicket ───────────────────────────────────────────────────────────────

  /tickets:
    get:
      summary: チケット一覧を取得する
      tags: [ StudyTicket ]
      description: |
        クエリパラメータで絞り込み可能。
        `sprintId` を省略した場合は全スプリントのチケットを返す。
        ソート順：`dueDate` 昇順 → `priority`（high → medium → low）降順。
      parameters:
        - name: sprintId
          in: query
          schema: { type: integer }
          description: 'スプリントIDで絞り込み（省略時は全件）'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TicketStatus' }
          description: 'ステータスで絞り込み'
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'

    post:
      summary: チケットを作成する
      tags: [ StudyTicket ]
      description: |
        `sprintId` を省略またはnullにした場合、バックログスプリントに自動配置される。
        `subCategoryIds` は1件以上必須。
        作成時の `status` は常に `todo`。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyTicketInput' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tickets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }

    get:
      summary: チケット詳細を取得する
      tags: [ StudyTicket ]
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: チケットを更新する
      tags: [ StudyTicket ]
      description: |
        `subCategoryIds` を送信した場合は全量置き換え（sync）。
        `status` を `done` に変更すると `completedAt` が自動セットされる。
        `status` を `done` 以外に変更すると `completedAt` がクリアされる（再オープン相当）。
        専用エンドポイント（`/complete` / `/reopen`）の使用を推奨。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyTicketUpdateInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      summary: チケットを削除する
      tags: [ StudyTicket ]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /tickets/{id}/complete:
    post:
      summary: チケットを完了する
      tags: [ StudyTicket ]
      description: |
        `status` を `done` に変更し `completedAt` を自動セットする。
        すでに `done` の場合は 422 を返す。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 完了成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tickets/{id}/reopen:
    post:
      summary: チケットを再オープンする
      tags: [ StudyTicket ]
      description: |
        `status` を `todo` に戻し `completedAt` をクリアする。
        `done` 以外のチケットに対しては 422 を返す。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 再オープン成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tickets/{id}/sprint:
    patch:
      summary: チケットを別のスプリントに移動する
      tags: [ StudyTicket ]
      description: バックログを含む任意のスプリントへ移動できる。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ sprintId ]
              properties:
                sprintId: { type: integer, description: '移動先スプリントID' }
      responses:
        '200':
          description: 移動成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyTicket' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # ── TicketNote ────────────────────────────────────────────────────────────────

  /tickets/{id}/notes:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: チケットID

    get:
      summary: チケットのノート一覧を取得する
      tags: [ StudyTicket ]
      description: 作成日昇順（スレッド順）で返す。
      responses:
        '200':
          description: 取得成功
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TicketNote' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      summary: チケットにノートを追加する
      tags: [ StudyTicket ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketNoteInput' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketNote' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /tickets/{id}/notes/{noteId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
        description: チケットID
      - name: noteId
        in: path
        required: true
        schema: { type: integer }
        description: ノートID

    put:
      summary: ノートを更新する
      tags: [ StudyTicket ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketNoteInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketNote' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      summary: ノートを削除する
      tags: [ StudyTicket ]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/logout:
    post:
      summary: ログアウト
      tags: [ Auth ]
      description: |
        現在使用中のアクセストークンを削除し、セッションを終了します。
        内部的には Laravel Sanctum の `currentAccessToken()->delete()` を実行します。
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: ログアウトしました。
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ── Snippets ─────────────────────────────────────────────────────────────────

  /snippets:
    get:
      summary: スニペット一覧を取得
      tags: [ Snippets ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Snippet' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: スニペットを作成
      tags: [ Snippets ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetInput' }
      responses:
        '201':
          description: 作成成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /snippets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer }
    put:
      summary: スニペットを更新
      tags: [ Snippets ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SnippetInput' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Snippet' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
    delete:
      summary: スニペットを削除
      tags: [ Snippets ]
      responses:
        '204':
          description: 削除成功
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
